name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente da versão (ex.: v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        name: Validar tag e versões
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release.mjs validate "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run build
      - name: Validar comandos do Windows
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $smokeAppData = Join-Path $env:RUNNER_TEMP 'rits-docker-fixture'
          $smokeDesktop = Join-Path $smokeAppData 'Programs\DockerDesktop\Docker Desktop.exe'
          New-Item -ItemType Directory -Path (Split-Path $smokeDesktop) -Force | Out-Null
          New-Item -ItemType File -Path $smokeDesktop -Force | Out-Null
          $env:LOCALAPPDATA = $smokeAppData
          node dev/windows-smoke.mjs
      - name: Gerar instalador nativo
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Testar backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked
      - run: node scripts/release.mjs collect ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Publicar somente com os dois instaladores
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          test -s release-assets/Rits-windows-x64-setup.exe
          test -s release-assets/Rits-macos-arm64.dmg
          (cd release-assets && sha256sum Rits-windows-x64-setup.exe Rits-macos-arm64.dmg > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/rits-release-draft; then
            if [ "$(cat /tmp/rits-release-draft)" = false ]; then
              echo "A release já está publicada."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Rits $RELEASE_TAG" --notes-file .github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
