[package]
name = "rits"
version = "0.2.0"
description = "Rits — a lightweight IDE for Python, Go and databases"
edition = "2021"

[lib]
name = "rits_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "0.36", default-features = false, features = ["minimal", "native-tls-tls"] }
futures-util = "0.3"
notify = "8"
ignore = "0.4.33"
regex = "1.13.1"
portable-pty = "0.9.0"
trash = "5.2.9"
encoding_rs = "0.8.42"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
