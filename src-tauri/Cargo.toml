[package]
name = "rits"
version = "0.5.2"
description = "Rits — a lightweight IDE for Python, Go and databases"
edition = "2021"

[lib]
name = "rits_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "0.36", default-features = false, features = ["minimal", "native-tls-tls"] }
futures-util = "0.3"
notify = "8"
ignore = "0.4.33"
regex = "1.13.1"
portable-pty = "0.9.0"
trash = "5.2.9"
encoding_rs = "0.8.42"
# Airflow plugin: HTTP client with the system TLS (validation on), OS secret store, random secrets.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
getrandom = "0.3"
base64 = "0.22"
# Jupyter plugin: kernel channels over WebSocket (Jupyter Server /api/kernels/<id>/channels).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "native-tls"] }
# Migration Audit: SHA-256 digests of canonical values (evidence files and baseline integrity).
sha2 = "0.11"
unicode-normalization = "0.1"

# Transparent windows (Liquid Glass / vibrancy) need the private API on macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# AI assistant dictation: Speech framework + the microphone through AVAudioEngine.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSLocale", "NSError", "NSObject"] }
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFErrors", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioFormat", "AVAudioBuffer", "AVAudioTypes", "AVAudioTime", "AVAudioApplication"] }

# AI assistant dictation on Windows: WinRT speech recognition (same windows crate Tauri uses).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Globalization", "Media_SpeechRecognition", "Win32_System_WinRT"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
